services:
  agency:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - agency-data:/data
      - ${USERPROFILE}/.codex/auth.json:/run/codex-auth.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/team').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  agency-data:
